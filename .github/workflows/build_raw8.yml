name: Build K230 RAW8 Firmware

# 放到 fork 的仓库 .github/workflows/build_raw8.yml
# 依赖 raw8_enable_v3.patch 放在仓库根目录
# 触发后从 Actions 页面或生成的 Release 下载 k230_canmv_01studio 镜像

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 注意：不要把仓库 checkout 到 k230_src。
      # repo init/sync 需要一个干净目录；若该目录已有 .git，会报
      # "unsupported checkout state" 并导致 sync 失败。
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Prepare SDK directory
        run: mkdir -p k230_src

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget bison flex gcc pkg-config \
            libncurses5-dev libconfuse-dev libssl-dev python3 python3-pip \
            python-is-python3 python3-venv cmake libyaml-dev scons mtools bzip2

      - name: Setup Python venv
        run: |
          python3 -m venv ~/.canmv_venv
          echo "source ~/.canmv_venv/bin/activate" >> $HOME/.bashrc
          source ~/.canmv_venv/bin/activate
          pip install pycryptodome gmssl jsonschema jinja2 toml

      - name: Sync CanMV SDK via manifest (https, no private key)
        working-directory: k230_src
        run: |
          source ~/.canmv_venv/bin/activate
          repo init -u https://github.com/canmv-k230/manifest.git \
            -b master \
            --repo-url=https://github.com/canmv-k230/git-repo.git \
            --depth=1
          repo sync -j$(nproc) --no-clone-bundle

      - name: Apply RAW8 modifications
        working-directory: k230_src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) 1080p OV5647 register table: RAW10 -> RAW8
          p = Path('src/rtsmart/mpp/kernel/sensor/src/ov5647/sensor_reg_table.c')
          s = p.read_text()
          anchor = s.index('ov5647_mipi2lane_1080p_30fps_linear[] = {')
          end = s.index('};', anchor)
          block = s[anchor:end]
          assert '{0x3034, 0x1a}' in block, '0x3034 RAW10 value not found in 1080p table'
          block = block.replace('{0x3034, 0x1a}', '{0x3034, 0x08}', 1)
          p.write_text(s[:anchor] + block + s[end:])

          # 2) CSI0 1080p30 mode: bit_width 10->8, MIPI data type 0x2B->0x2A
          p = Path('src/rtsmart/mpp/kernel/sensor/src/ov5647/sensor_csi0_mode_list.c')
          s = p.read_text()
          anchor = s.index('sensor_csi0_mode_list[] = {')
          start = s.index('.index = 1,', anchor)
          end = s.index('.index = 2,', start)
          block = s[start:end]
          assert '.bit_width = 10' in block, 'bit_width 10 not found in 1080p30 mode'
          assert '.data_type = 0x2B' in block, 'data_type 0x2B not found in 1080p30 mode'
          block = block.replace('.bit_width = 10', '.bit_width = 8', 1)
          block = block.replace('.data_type = 0x2B', '.data_type = 0x2A', 1)
          p.write_text(s[:start] + block + s[end:])

          # 3) sensor.py: expose 8BPP bayer buffer calculation
          p = Path('src/canmv/port/builtin_py/media/sensor.py')
          s = p.read_text()
          old_list = (
              "elif pix_format in [PIXEL_FORMAT_RGB_BAYER_10BPP, PIXEL_FORMAT_RGB_BAYER_12BPP, \\\n"
              "                            PIXEL_FORMAT_RGB_BAYER_14BPP, PIXEL_FORMAT_RGB_BAYER_16BPP]:"
          )
          new_list = (
              "elif pix_format in [PIXEL_FORMAT_RGB_BAYER_8BPP, \\\n"
              "                            PIXEL_FORMAT_RGB_BAYER_10BPP, PIXEL_FORMAT_RGB_BAYER_12BPP, \\\n"
              "                            PIXEL_FORMAT_RGB_BAYER_14BPP, PIXEL_FORMAT_RGB_BAYER_16BPP]:"
          )
          assert old_list in s, 'sensor.py Bayer list not found'
          s = s.replace(old_list, new_list, 1)
          old_buf = "buf_size = ALIGN_UP((in_width * in_height * 2), VICAP_ALIGN_4K)"
          new_buf = (
              "buf_size = ALIGN_UP((in_width * in_height), VICAP_ALIGN_4K) "
              "if pix_format == PIXEL_FORMAT_RGB_BAYER_8BPP "
              "else ALIGN_UP((in_width * in_height * 2), VICAP_ALIGN_4K)"
          )
          assert old_buf in s, 'sensor.py buffer line not found'
          s = s.replace(old_buf, new_buf, 1)
          p.write_text(s)
          PY
          echo "RAW8 modification applied:"
          grep -n "0x3034" src/rtsmart/mpp/kernel/sensor/src/ov5647/sensor_reg_table.c | head -3
          grep -n "bit_width.*8" src/rtsmart/mpp/kernel/sensor/src/ov5647/sensor_csi0_mode_list.c | head -3

      - name: Download toolchain
        working-directory: k230_src
        run: |
          source ~/.canmv_venv/bin/activate
          make dl_toolchain TOOLCHAIN=rtsmart

      - name: Build firmware (01Studio config)
        working-directory: k230_src
        run: |
          source ~/.canmv_venv/bin/activate
          make k230_canmv_01studio_defconfig
          make -j$(nproc)

      - name: Collect images
        run: |
          mkdir -p artifacts
          find k230_src/output -type f \( -name "*.img" -o -name "*.img.gz" -o -name "*.kdimg" \) \
            -exec cp {} artifacts/ \;
          ls -lh artifacts/
          test -n "$(ls -A artifacts/)" || { echo "No image produced"; exit 1; }

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: k230-raw8-firmware
          path: artifacts/*
          retention-days: 30
